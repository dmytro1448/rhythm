name: bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -q -r requirements.txt

      - run: python -m bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          APP_KEY: ${{ secrets.APP_KEY }}
          GITHUB_REPO: ${{ github.repository }}
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          MORNING_TIME: ${{ vars.MORNING_TIME }}
          MIDDAY_TIME: ${{ vars.MIDDAY_TIME }}
          EVENING_TIME: ${{ vars.EVENING_TIME }}
          REMIND_BEFORE_MIN: ${{ vars.REMIND_BEFORE_MIN }}

      - name: Save state
        if: always()
        run: |
          for f in data/state.enc data/progress.enc; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git config user.name "rhythm-bot"
          git config user.email "rhythm-bot@users.noreply.github.com"
          git commit -qm "state"
          git pull -q --rebase
          git push -q

      # Страховка: якщо GitHub cron затримується (>15 хв без запуску за розкладом),
      # бот сам планує наступний запуск. Коли cron оживає — ланцюжок зупиняється.
      - name: Keepalive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list -R "$GITHUB_REPOSITORY" -w bot -e schedule -L 1 --json createdAt --jq '.[0].createdAt // ""')
          age=999999
          [ -n "$last" ] && age=$(( $(date +%s) - $(date -d "$last" +%s) ))
          if [ "$age" -gt 900 ]; then
            echo "cron мовчить ${age}s — плануємо наступний запуск"
            sleep 200
            gh workflow run bot -R "$GITHUB_REPOSITORY" --ref main
          fi
