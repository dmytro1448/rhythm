<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ритм</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0D100E; --surface: #161A17; --surface2: #1D221E; --line: #262D27;
  --text: #EEF1E8; --muted: #8B9488; --faint: #5A6358;
  --accent: #C6F432; --accent-ink: #172000; --amber: #FFB23E; --coral: #FF6B4A; --sky: #6FB7FF;
  --sil: #232924; --heat0: #1A1F1B;
  --r: 22px;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #F3F0E7; --surface: #FFFFFF; --surface2: #F8F6EF; --line: #E4E0D3;
  --text: #161A14; --muted: #6E7568; --faint: #A6AA9C;
  --accent: #5F9600; --accent-ink: #FFFFFF; --amber: #D98A00; --coral: #E5482A; --sky: #2F7FD8;
  --sil: #E3E0D5; --heat0: #ECE9DF;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font: 500 15px/1.4 Manrope, system-ui, sans-serif;
  padding: 0 16px calc(96px + env(safe-area-inset-bottom));
  max-width: 520px; margin: 0 auto; overflow-x: hidden;
  -webkit-user-select: none; user-select: none;
}
.num { font-family: Unbounded, Manrope, sans-serif; letter-spacing: -0.02em; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

/* ---------- шапка */
header { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 6px; }
.hello small { display: block; color: var(--muted); font-size: 13px; font-weight: 600; text-transform: lowercase; }
.hello b { font: 700 22px/1.15 Unbounded, sans-serif; letter-spacing: -0.02em; }
.lvl { position: relative; width: 54px; height: 54px; display: grid; place-items: center; }
.lvl svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.lvl .num { font-size: 17px; font-weight: 800; }
.lvl small { position: absolute; bottom: -4px; font-size: 9px; font-weight: 800; letter-spacing: .08em; color: var(--accent);
  background: var(--bg); padding: 0 4px; border-radius: 6px; text-transform: uppercase; }
.demo { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--amber);
  border: 1px solid currentColor; border-radius: 99px; padding: 2px 7px; margin-left: 8px; vertical-align: 3px; }

/* ---------- герой */
.hero { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: center;
  background: var(--surface); border-radius: var(--r); padding: 16px; margin-top: 12px; position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); pointer-events: none; }
.ring { position: relative; width: 132px; height: 132px; }
.ring svg { transform: rotate(-90deg); }
.ring .c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .pct { font-size: 34px; font-weight: 800; line-height: 1; }
.ring .pct sup { font-size: 16px; vertical-align: 14px; margin-left: 1px; }
.ring .sub { color: var(--muted); font-size: 12px; font-weight: 600; margin-top: 4px; }
.ring circle { transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1), stroke .4s; }
.chips { display: grid; gap: 8px; position: relative; z-index: 1; }
.chip { display: flex; align-items: center; gap: 10px; background: var(--surface2); border-radius: 14px; padding: 10px 12px; }
.chip .ic { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 15px; }
.chip .num { font-size: 18px; font-weight: 700; line-height: 1; }
.chip small { display: block; color: var(--muted); font-size: 11px; font-weight: 600; margin-top: 2px; }
.xpbar { height: 6px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 6px; }
.xpbar i { display: block; height: 100%; background: var(--accent); border-radius: 9px; transition: width 1s cubic-bezier(.2,.8,.2,1); }

/* ---------- вкладки */
nav { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 14px 0 10px; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--surface); border-radius: 16px; padding: 4px; position: relative; }
.tabs .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 4); border-radius: 12px;
  background: var(--text); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
.tabs button { position: relative; z-index: 1; padding: 9px 0; font-size: 12.5px; font-weight: 700; color: var(--muted); transition: color .25s; }
.tabs button.on { color: var(--bg); }
.tabs .dot { position: absolute; top: -5px; right: 0; min-width: 17px; height: 17px; box-shadow: 0 0 0 3px var(--bg); border-radius: 9px; background: var(--coral);
  color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; padding: 0 4px; animation: pop .4s; }

section.tab { display: none; animation: rise .35s ease; }
section.tab.on { display: block; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } }
h3 { font: 700 13px/1 Manrope; color: var(--muted); text-transform: uppercase; letter-spacing: .09em; margin: 22px 4px 10px; display: flex; justify-content: space-between; }
h3 span { color: var(--faint); }

/* ---------- справи */
.tasks { display: grid; gap: 8px; }
.task { display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; background: var(--surface);
  border-radius: 16px; padding: 14px; text-align: left; transition: transform .15s, background .3s; position: relative; }
.task:active { transform: scale(.98); }
.box { width: 30px; height: 30px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; transition: all .25s cubic-bezier(.3,1.5,.5,1); }
.box svg { width: 16px; height: 16px; stroke: var(--accent-ink); stroke-width: 3.2; fill: none; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .3s .05s; }
.task.done .box { background: var(--accent); border-color: var(--accent); transform: rotate(-8deg); }
.task.done .box svg { stroke-dashoffset: 0; }
.task .t { font-weight: 600; transition: color .3s; }
.task.done .t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.task time { color: var(--muted); font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; }
.task .pts { color: var(--faint); font: 700 12px Unbounded; }
.task.done .pts { color: var(--accent); }
.task .kd { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--coral);
  border: 1px solid currentColor; border-radius: 6px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
.ledger div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); font-weight: 600; }
.ledger div:first-child { border-top: 0; }
.ledger b { font: 700 14px Unbounded; white-space: nowrap; }
.ledger .plus { color: var(--accent); } .ledger .minus { color: var(--coral); }
.late { background: color-mix(in srgb, var(--coral) 12%, var(--surface)); border-radius: 16px; padding: 12px 14px; }
.late div { display: flex; justify-content: space-between; padding: 6px 0; font-weight: 600; }
.late small { color: var(--coral); font-weight: 700; }
.task.pending::after { content: ""; position: absolute; left: 6px; top: 50%; width: 4px; height: 4px; margin-top: -2px; border-radius: 50%; background: var(--amber); }
.float { position: fixed; pointer-events: none; font: 800 16px Unbounded; color: var(--accent); z-index: 50; animation: floatUp 1s ease-out forwards; }
@keyframes floatUp { to { transform: translateY(-46px); opacity: 0; } }
.empty { background: var(--surface); border-radius: 16px; padding: 20px; color: var(--muted); text-align: center; font-weight: 600; }
.mini { display: grid; gap: 2px; background: var(--surface); border-radius: 16px; padding: 6px 14px; }
.mini div { display: flex; gap: 12px; padding: 8px 0; color: var(--muted); font-weight: 600; }
.mini div + div { border-top: 1px solid var(--line); }
.mini time:empty { display: none; }
.task time:empty { display: none; }
.mini time { width: 84px; flex: none; color: var(--faint); font-size: 12px; font-weight: 700; padding-top: 2px; }

/* ---------- яйце-тизер */
.next { display: grid; grid-template-columns: 74px 1fr; gap: 14px; align-items: center; background: var(--surface); border-radius: 18px; padding: 14px; text-align: left; width: 100%; }
.next .egg { width: 64px; animation: wobble 3s ease-in-out infinite; transform-origin: 50% 90%; }
.next b { display: block; font-weight: 700; }
.next small { color: var(--muted); font-weight: 600; }
.bar { height: 8px; background: var(--line); border-radius: 9px; overflow: hidden; margin-top: 8px; }
.bar i { display: block; height: 100%; border-radius: 9px; transition: width 1s cubic-bezier(.2,.8,.2,1); }
.banner { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin-top: 12px; padding: 12px 14px; border-radius: 16px;
  background: linear-gradient(110deg, color-mix(in srgb, var(--amber) 22%, var(--surface)), var(--surface)); font-weight: 700; }
.banner .egg { width: 34px; animation: shake .9s ease-in-out infinite; }
.banner span { margin-left: auto; color: var(--amber); }
@keyframes wobble { 0%, 80%, 100% { transform: rotate(0); } 85% { transform: rotate(-7deg); } 90% { transform: rotate(6deg); } 95% { transform: rotate(-3deg); } }
@keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }

/* ---------- цілі */
.goal { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 8px; }
.goal .top { display: flex; align-items: center; gap: 12px; }
.goal .em { width: 40px; height: 40px; border-radius: 12px; background: var(--surface2); display: grid; place-items: center; font-size: 20px; flex: none; }
.goal b { font-weight: 700; display: block; }
.goal small { color: var(--muted); font-weight: 600; }
.goal .num { margin-left: auto; font-size: 24px; font-weight: 800; }
.goal .num sup { font-size: 12px; vertical-align: 9px; }
.seg { display: grid; grid-auto-flow: column; gap: 3px; margin-top: 14px; height: 10px; }
.seg i { border-radius: 3px; background: var(--line); transition: background .3s; }
.seg i.f { background: var(--accent); }
.goal.done .num { color: var(--accent); }
.month { display: flex; align-items: center; gap: 14px; background: var(--text); color: var(--bg); border-radius: 18px; padding: 16px; margin-bottom: 8px; }
.month .num { font-size: 34px; font-weight: 800; }
.month small { opacity: .65; font-weight: 600; display: block; }

/* ---------- колекція */
.coll-head { display: flex; align-items: flex-end; justify-content: space-between; margin: 4px 4px 12px; }
.coll-head .num { font-size: 30px; font-weight: 800; }
.coll-head .num span { color: var(--faint); }
.rar { display: flex; gap: 10px; font-size: 12px; font-weight: 700; color: var(--muted); }
.rar i { display: inline-block; width: 8px; height: 8px; border-radius: 3px; margin-right: 4px; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cell { aspect-ratio: .82; border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 8px; text-align: center; position: relative; overflow: hidden; transition: transform .15s; }
.cell:active { transform: scale(.95); }
.cell .art { width: 86%; flex: 1; display: grid; place-items: center; }
.cell .art svg { width: 100%; }
.cell .egg svg { width: 52%; margin: 0 auto; display: block; }
.cell .nm { font-size: 11px; font-weight: 700; line-height: 1.2; min-height: 26px; display: grid; place-items: center; }
.cell.locked .egg { filter: grayscale(1) brightness(.55); opacity: .7; }
:root[data-theme="light"] .cell.locked .egg { filter: grayscale(1) brightness(1.05); opacity: .45; }
.cell.locked { padding-bottom: 18px; }
.cell.locked .nm { color: var(--faint); font-weight: 600; font-size: 10.5px; }
.cell .pr { position: absolute; left: 12px; right: 12px; bottom: 9px; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.cell .pr i { display: block; height: 100%; background: var(--faint); }
.cell.new { background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--rc) 35%, var(--surface)), var(--surface) 70%); }
.cell.new .egg { animation: shake 1s ease-in-out infinite; }
.cell.new .nm { color: var(--rc); }
.cell.got { background: linear-gradient(170deg, color-mix(in srgb, var(--rc) 16%, var(--surface)), var(--surface) 75%); }
.cell .tag { position: absolute; top: 9px; left: 9px; width: 7px; height: 7px; border-radius: 3px; background: var(--rc); }
.cell.leg { box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--rc) 60%, transparent); }

.creature svg { animation: bob 2.6s ease-in-out infinite; overflow: visible; }
.creature .eye { animation: blink 5s infinite; transform-box: fill-box; transform-origin: center; }
.creature .spark { animation: twinkle 1.6s ease-in-out infinite alternate; }
@keyframes bob { 50% { transform: translateY(-4%); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }
@keyframes twinkle { from { opacity: .2; } to { opacity: 1; } }

/* ---------- екранний час */
.screen { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: 18px; padding: 14px; }
.screen .ic { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; font-size: 20px; background: color-mix(in srgb, var(--sky) 18%, transparent); }
.screen b { font: 700 20px Unbounded; letter-spacing: -.02em; display: block; }
.screen small { color: var(--muted); font-weight: 600; }
.trend { font-weight: 800; font-size: 13px; padding: 6px 10px; border-radius: 10px; }
.trend.down { color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
.trend.up { color: var(--coral); background: color-mix(in srgb, var(--coral) 14%, transparent); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 90px; }
.bars i { flex: 1; background: var(--sky); border-radius: 4px 4px 2px 2px; min-height: 3px; opacity: .85; }
.bars i.empty { background: var(--line); opacity: .5; }

/* ---------- історія */
.heat-wrap { background: var(--surface); border-radius: 18px; padding: 14px; }
.wd, .heat { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.wd span { font-size: 10px; font-weight: 700; color: var(--faint); text-align: center; text-transform: uppercase; padding-bottom: 6px; }
.heat button { aspect-ratio: 1; border-radius: 8px; background: var(--heat0); position: relative; font-size: 10px; font-weight: 700; color: transparent; transition: transform .15s; }
.heat button:active { transform: scale(.85); }
.heat button.today { box-shadow: 0 0 0 2px var(--text); }
.heat button.future { background: transparent; border: 1px dashed var(--line); }
.heat button.perfect::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--accent-ink); font-size: 11px; }
.legend { display: flex; align-items: center; gap: 4px; justify-content: flex-end; margin-top: 10px; font-size: 11px; color: var(--faint); font-weight: 600; }
.legend i { width: 11px; height: 11px; border-radius: 3px; }
.energy { background: var(--surface); border-radius: 18px; padding: 14px 14px 8px; }
.energy svg { width: 100%; height: 90px; display: block; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 16px; padding: 14px 12px; }
.stat .num { font-size: 22px; font-weight: 800; display: block; }
.stat small { color: var(--muted); font-size: 11px; font-weight: 600; }

/* ---------- шторка */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 30; }
.scrim.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-width: 520px; margin: 0 auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 10px 20px calc(24px + env(safe-area-inset-bottom)); transform: translateY(105%); transition: transform .35s cubic-bezier(.2,.9,.3,1); z-index: 31; max-height: 82vh; overflow: auto; }
.sheet.on { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { font: 700 22px/1.2 Unbounded; margin: 0 0 4px; letter-spacing: -.02em; }
.sheet .muted { color: var(--muted); font-weight: 600; }
.sheet .big { width: 64%; margin: 4px auto 6px; }
.lore { display: grid; gap: 8px; margin-top: 16px; }
.lore div { background: var(--surface2); border-radius: 14px; padding: 12px 14px; }
.lore small { display: block; color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.note { background: var(--surface2); border-radius: 14px; padding: 12px 14px; margin-top: 8px; font-weight: 600; }
.rbadge { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--rc); }

/* ---------- вилуплення */
.hatch { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--rc) 30%, #070908), #070908 65%); color: #fff; padding: 24px; text-align: center; }
.hatch.on { display: flex; animation: fadeIn .3s; }
@keyframes fadeIn { from { opacity: 0; } }
.hatch .stage { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
.hatch .rays { position: absolute; inset: -60px; border-radius: 50%; opacity: 0; transition: opacity .6s;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--rc) 40%, transparent) 0 10deg, transparent 10deg 30deg);
  -webkit-mask: radial-gradient(circle, #000 20%, transparent 68%); mask: radial-gradient(circle, #000 20%, transparent 68%); animation: spin 14s linear infinite; }
.hatch.out .rays { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }
.hatch .bigegg { width: 150px; transition: transform .12s; cursor: pointer; }
.hatch .bigegg.hit { animation: hit .35s; }
@keyframes hit { 20% { transform: rotate(-14deg) scale(1.06); } 50% { transform: rotate(12deg) scale(.97); } 80% { transform: rotate(-5deg); } }
.hatch .born { position: absolute; width: 230px; transform: scale(0); }
.hatch.out .bigegg { display: none; }
.hatch.out .born { animation: born .9s cubic-bezier(.3,1.6,.5,1) forwards; }
@keyframes born { 0% { transform: scale(0) rotate(-20deg); } 100% { transform: scale(1) rotate(0); } }
.hatch .flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
.hatch.out .flash { animation: flash .6s; }
@keyframes flash { 0% { opacity: .95; } 100% { opacity: 0; } }
.hatch .hint { margin-top: 28px; font-weight: 700; color: rgba(255,255,255,.7); min-height: 22px; }
.hatch .taps { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.hatch .taps i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.2); transition: background .2s, transform .2s; }
.hatch .taps i.f { background: var(--rc); transform: scale(1.3); }
.hatch .info { opacity: 0; transform: translateY(14px); transition: all .5s .6s; margin-top: 18px; max-width: 340px; }
.hatch.out .info { opacity: 1; transform: none; }
.hatch .info h2 { font: 800 26px/1.15 Unbounded; margin: 6px 0 8px; letter-spacing: -.02em; }
.hatch .info p { color: rgba(255,255,255,.75); font-weight: 600; margin: 0; }
.hatch .take { margin-top: 22px; background: #fff; color: #0D100E; font-weight: 800; padding: 14px 28px; border-radius: 16px; }
.hatch.out .taps, .hatch.out .hint { display: none; }

/* ---------- інше */
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
.toast { position: fixed; left: 50%; top: 18px; transform: translate(-50%, -300%); background: var(--text); color: var(--bg); font-weight: 800;
  padding: 12px 18px; border-radius: 14px; z-index: 70; transition: transform .4s cubic-bezier(.3,1.5,.5,1); white-space: nowrap; }
.toast.on { transform: translate(-50%, 0); }
.savebar { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 488px; margin: 0 auto;
  background: var(--accent); color: var(--accent-ink); border-radius: 16px; padding: 16px; font-weight: 800; text-align: center; z-index: 20;
  transform: translateY(160%); transition: transform .35s cubic-bezier(.3,1.4,.5,1); }
.savebar.on { transform: none; }
.loading { display: grid; place-items: center; height: 70vh; color: var(--muted); font-weight: 700; }
.loading .egg { width: 56px; animation: shake 1s infinite; margin-bottom: 14px; }
.foot { text-align: center; color: var(--faint); font-size: 11px; font-weight: 600; margin-top: 26px; }
</style>
</head>
<body>
<div id="app" class="loading"><div><div class="egg" id="ldegg"></div>завантаження…</div></div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>

<div class="hatch" id="hatch">
  <div class="flash"></div>
  <div class="rbadge" id="hRar"></div>
  <div class="stage"><div class="rays"></div><div class="bigegg" id="hEgg"></div><div class="born creature" id="hBorn"></div></div>
  <div class="taps" id="hTaps"><i></i><i></i><i></i><i></i></div>
  <div class="hint" id="hHint">Тапай по яйцю</div>
  <div class="info"><h2 id="hName"></h2><p id="hLore"></p><button class="take" id="hTake">Забрати в колекцію</button></div>
</div>

<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>
<button class="savebar" id="savebar"></button>

<script src="creatures.js"></script>
<script>
const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
const inTG = !!(tg && tg.platform && tg.platform !== "unknown");
const $ = (s) => document.querySelector(s);
const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Нд"];
const TABS = [["day", "День"], ["goals", "Цілі"], ["coll", "Колекція"], ["hist", "Історія"]];

let D = null, demo = false, tab = "day", pending = {}, seen = new Set();

// ---------- утиліти
const haptic = (kind, v) => { try { kind === "n" ? tg.HapticFeedback.notificationOccurred(v) : kind === "s" ? tg.HapticFeedback.selectionChanged() : tg.HapticFeedback.impactOccurred(v); } catch (e) {} };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function toast(text) { const t = $("#toast"); t.textContent = text; t.classList.add("on"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("on"), 2200); }
function plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }

const store = {
  get(k) { return new Promise((res) => { try { if (inTG && tg.CloudStorage) return tg.CloudStorage.getItem(k, (e, v) => res(e ? localStorage.getItem(k) : v)); } catch (e) {} try { res(localStorage.getItem(k)); } catch (e) { res(null); } }); },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} try { if (inTG && tg.CloudStorage) tg.CloudStorage.setItem(k, v); } catch (e) {} },
};

// ---------- дані
function b64(s) { s = s.trim().replace(/-/g, "+").replace(/_/g, "/"); while (s.length % 4) s += "="; return Uint8Array.from(atob(s), (c) => c.charCodeAt(0)); }

async function load() {
  const q = new URLSearchParams(location.search), repo = q.get("r"), key = q.get("k");
  if (!repo || !key) { demo = true; return demoData(); }
  let text;
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/data/progress.enc`, { headers: { Accept: "application/vnd.github.raw" }, cache: "no-store" });
    if (!r.ok) throw 0;
    text = await r.text();
  } catch (e) {
    text = await (await fetch(`https://raw.githubusercontent.com/${repo}/main/data/progress.enc?t=${Date.now()}`)).text();
  }
  const blob = b64(text);
  const k = await crypto.subtle.importKey("raw", b64(key), "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, k, blob.slice(12));
  return JSON.parse(new TextDecoder().decode(plain));
}

function demoData() {
  const today = new Date(); const iso = (d) => d.toISOString().slice(0, 10);
  const heat = [];
  for (let i = 41; i >= 0; i--) {
    const d = new Date(today); d.setDate(d.getDate() - i);
    const planned = i > 30 ? 0 : 4 + (i % 3), done = i > 30 ? 0 : Math.min(planned, Math.round(planned * (0.4 + ((i * 37) % 60) / 100)));
    heat.push({ d: iso(d), planned, done, pct: planned ? Math.round((100 * done) / planned) : null, energy: i > 30 ? null : 2 + ((i * 7) % 4), notes: i === 2 ? ["Виспався, багато енергії зранку"] : [], report: i < 25, screen: i < 12 ? 300 - (12 - i) * 9 + ((i * 53) % 70) : null });
  }
  const rarities = ["common", "common", "common", "common", "common", "common", "rare", "rare", "rare", "rare", "rare", "rare", "epic", "epic", "epic", "epic", "epic", "epic", "legendary", "legendary", "legendary"];
  const hints = ["Виконай першу справу", "Надішли перший звіт", "Надішли перший голосовий звіт", "Серія 3 дні", "10 виконаних справ", "Досягни 3 рівня", "Перший день на 100%", "7 звітів", "Серія 7 днів", "50 виконаних справ", "Будь-яка ціль на 50%", "10 голосових звітів", "Досягни 5 рівня", "5 днів на 100%", "Серія 14 днів", "Досягни будь-якої цілі", "100 виконаних справ", "20 днів за місяць ≥70%", "Досягни 10 рівня", "Серія 30 днів", "Всі цілі місяця на 100%"];
  const roster = rarities.map((r, i) => ({ id: "a" + i, rarity: r, hint: hints[i], progress: i < 8 ? 1 : [0.6, 0.35, 0.8, 0.2, 0.5, 0.1][i % 6], unlocked: [0, 1, 2, 3, 6, 7, 12].includes(i) ? iso(today) : null, seed: [0, 1, 2, 3, 6, 7, 12].includes(i) ? 1000 + i * 7919 : null }));
  return {
    v: 1, today: { date: iso(today), title: "Сьогодні", tasks: [
      { id: "t1", title: "Підйом до 9:00", time: "09:00", kind: "habit", pts: 10, done: true },
      { id: "t2", title: "Їжа у FatSecret", time: "", kind: "habit", pts: 10, done: true },
      { id: "t3", title: "Розтяжка", time: "", kind: "habit", pts: 10, done: false },
      { id: "t4", title: "Python-курс · 1 год", time: "", kind: "habit", pts: 10, done: false },
      { id: "t6", title: "Подати документи на проїзний", time: "", kind: "deadline", pts: 40, done: false } ],
      points: 20, ledger: [{ d: "", p: 10, w: "✓ Підйом до 9:00" }, { d: "", p: 10, w: "✓ Їжа у FatSecret" }] },
    overdue: [{ title: "Дізнатись про SIM-картку", kind: "task", since: new Date(Date.now() - 2 * 864e5).toISOString().slice(0, 10) }],
    tomorrow: [{ title: "Тренування", time: "" }, { title: "Англійська · 2 уроки", time: "" }],
    player: { xp: 640, level: 4, floor: 600, next: 1000, streak: 6, best: 9, tasks: 58, reports: 19, voice: 11, perfect: 4 },
    goals: [
      { id: "g1", title: "Тренування", emoji: "🏃", progress: 9, target: 12, unit: "разів", pct: 75 },
      { id: "g2", title: "Прочитати 2 книги", emoji: "📚", progress: 240, target: 600, unit: "сторінок", pct: 40 },
      { id: "g3", title: "Відкласти гроші", emoji: "💰", progress: 5000, target: 5000, unit: "грн", pct: 100 } ],
    heat, roster,
  };
}

// ---------- рендер
function taskDone(t) { return t.id in pending ? pending[t.id] : t.done; }
function todayStats() { const ts = D.today.tasks; const n = ts.filter(taskDone).length; return { n, all: ts.length, pct: ts.length ? Math.round((100 * n) / ts.length) : 0 }; }
function unseen() { return D.roster.filter((a) => a.unlocked && !seen.has(a.id)); }

function render() {
  const p = D.player, st = todayStats();
  const now = new Date(D.today.date + "T12:00");
  const greet = ["Доброї ночі", "Доброго ранку", "Доброго дня", "Доброго вечора"][Math.floor(((new Date().getHours() + 2) % 24) / 6)];
  const lvlPct = Math.min(1, (p.xp - p.floor) / Math.max(1, p.next - p.floor));
  const app = $("#app"); app.className = "";
  app.innerHTML = `
  <header>
    <div class="hello"><small>${now.toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" })}${demo ? '<span class="demo">демо</span>' : ""}</small><b>${greet}</b></div>
    <div class="lvl">${ringSVG(54, 4, lvlPct, "var(--accent)")}<span class="num">${p.level}</span><small>рівень</small></div>
  </header>
  <div class="hero">
    <div class="ring" id="ring">${ringSVG(132, 12, 0, "var(--accent)")}<div class="c"><div class="pct num"><span id="pctN">${st.pct}</span><sup>%</sup></div><div class="sub" id="pctS">${st.n} з ${st.all} ${plural(st.all, "справи", "справ", "справ")}</div></div></div>
    <div class="chips">
      <div class="chip"><div class="ic" style="background:color-mix(in srgb,var(--coral) 18%,transparent)">🔥</div><div><span class="num">${p.streak}</span><small>${plural(p.streak, "день", "дні", "днів")} серія · рекорд ${p.best}</small></div></div>
      <button class="chip" id="ptsChip" style="display:block;text-align:left;width:100%"><span class="num" id="ptsN">${fmtSigned(dayPoints())}</span> <span style="font-size:11px;color:var(--muted);font-weight:700">сьогодні</span><small>${fmtN(p.xp)} балів · ще ${fmtN(p.next - p.xp)} до ${p.level + 1} рів.</small><div class="xpbar"><i style="width:${lvlPct * 100}%"></i></div></button>
    </div>
  </div>
  <nav><div class="tabs" id="tabs"><div class="pill"></div>${TABS.map(([id, n]) => `<button data-tab="${id}">${n}${id === "coll" && unseen().length ? `<span class="dot">${unseen().length}</span>` : ""}</button>`).join("")}</div></nav>
  <section class="tab" id="t-day">${dayTab()}</section>
  <section class="tab" id="t-goals">${goalsTab()}</section>
  <section class="tab" id="t-coll">${collTab()}</section>
  <section class="tab" id="t-hist">${histTab()}</section>
  <div class="foot">Звіти — голосом або текстом у бот · дані оновлюються кожні кілька хвилин</div>`;
  bind();
  setTab(tab, true);
  requestAnimationFrame(() => setTimeout(() => setRing(st.pct), 60));
}

function ringSVG(size, w, frac, color) {
  const r = (size - w) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${w}"/><circle class="arc" cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}"/></svg>`;
}
function setRing(pct) {
  const arc = $("#ring .arc"); if (!arc) return;
  const c = parseFloat(arc.getAttribute("stroke-dasharray"));
  arc.style.strokeDashoffset = c * (1 - pct / 100);
  arc.style.stroke = pct >= 100 ? "var(--amber)" : "var(--accent)";
}

function dayTab() {
  const ts = D.today.tasks, nu = unseen();
  const next = D.roster.filter((a) => !a.unlocked).sort((a, b) => b.progress - a.progress)[0];
  return `
  ${nu.length ? `<button class="banner" data-go="coll"><div class="egg">${eggSVG(nu[0].rarity, 1)}</div>${nu.length} ${plural(nu.length, "нове яйце", "нові яйця", "нових яєць")} чекає<span>→</span></button>` : ""}
  <h3>Сьогодні <span>${D.today.tasks.filter(taskDone).length}/${ts.length}</span></h3>
  ${ts.length ? `<div class="tasks">${ts.map((t) => `<button class="task ${taskDone(t) ? "done" : ""} ${t.id in pending ? "pending" : ""}" data-task="${esc(t.id)}"><div class="box"><svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg></div><div class="t">${esc(t.title)}${t.kind === "deadline" ? '<span class="kd">дедлайн</span>' : ""}</div>${t.time ? `<time>${esc(t.time)}</time>` : `<span class="pts">+${t.pts}</span>`}</button>`).join("")}</div>` : `<div class="empty">Вільний день. Відпочинок — теж частина ритму.</div>`}
  ${D.overdue?.length ? `<h3>Прострочено <span>−бали щодня</span></h3><div class="late">${D.overdue.map((o) => `<div>${esc(o.title)}<small>з ${new Date(o.since + "T12:00").toLocaleDateString("uk-UA", { day: "numeric", month: "short" })}</small></div>`).join("")}<div style="color:var(--muted);font-size:13px">Скажи боту: перенести, виконано чи скасувати</div></div>` : ""}
  ${screenCard()}
  ${next ? `<h3>Наступне яйце</h3><button class="next" data-go="coll"><div class="egg">${eggSVG(next.rarity, next.progress >= 0.66 ? 2 : next.progress >= 0.33 ? 1 : 0)}</div><div><b>${esc(next.hint)}</b><small>${rarName(next.rarity)} · ${Math.round(next.progress * 100)}%</small><div class="bar"><i style="width:${next.progress * 100}%;background:${RARITY_COLOR[next.rarity]}"></i></div></div></button>` : ""}
  ${D.tomorrow?.length ? `<h3>Завтра</h3><div class="mini">${D.tomorrow.map((t) => `<div><time>${esc(t.time)}</time>${esc(t.title)}</div>`).join("")}</div>` : ""}`;
}

const hm = (m) => m >= 60 ? `${Math.floor(m / 60)} год ${String(m % 60).padStart(2, "0")} хв` : `${m} хв`;
function screenCard() {
  const s = D.heat.filter((h) => h.screen != null);
  if (!s.length) return `<h3>Екранний час</h3><div class="screen"><div class="ic">📱</div><div><b style="font-size:15px;font-family:Manrope">Скинь скрін у бот</b><small>Screen Time — і тут зʼявиться твій прогрес</small></div></div>`;
  const last = s[s.length - 1], prev = s[s.length - 2];
  const diff = prev ? last.screen - prev.screen : 0;
  const day = new Date(last.d + "T12:00").toLocaleDateString("uk-UA", { weekday: "long" });
  return `<h3>Екранний час <span>${day}</span></h3><button class="screen" data-go="hist" style="width:100%;text-align:left"><div class="ic">📱</div><div><b>${hm(last.screen)}</b><small>${s.length > 1 ? `в середньому ${hm(Math.round(s.slice(-7).reduce((a, h) => a + h.screen, 0) / Math.min(7, s.length)))}` : "перший замір"}</small></div>${prev ? `<span class="trend ${diff <= 0 ? "down" : "up"}">${diff <= 0 ? "↓" : "↑"} ${hm(Math.abs(diff))}</span>` : ""}</button>`;
}

function goalsTab() {
  const gs = D.goals || [];
  if (!gs.length) return `<div class="empty" style="margin-top:4px">Цілей ще немає.<br>Скажи боту: «додай ціль — 12 тренувань за місяць»</div>`;
  const avg = Math.round(gs.reduce((s, g) => s + g.pct, 0) / gs.length);
  return `<div class="month"><span class="num">${avg}%</span><div><b>Глобальний прогрес</b><small>${gs.filter((g) => g.pct >= 100).length} з ${gs.length} ${plural(gs.length, "цілі", "цілей", "цілей")} досягнуто</small></div></div>
  ${gs.map((g) => { const segs = Math.min(20, Math.max(5, g.target <= 20 ? g.target : 20)); const f = Math.round((g.pct / 100) * segs);
    return `<div class="goal ${g.pct >= 100 ? "done" : ""}"><div class="top"><div class="em">${esc(g.emoji || "◎")}</div><div><b>${esc(g.title)}</b><small>${fmtN(g.progress)} / ${fmtN(g.target)} ${esc(g.unit)}</small></div><span class="num">${g.pct}<sup>%</sup></span></div>
    <div class="seg">${Array.from({ length: segs }, (_, i) => `<i class="${i < f ? "f" : ""}" style="transition-delay:${i * 30}ms"></i>`).join("")}</div></div>`; }).join("")}`;
}
const fmtN = (n) => Number(n).toLocaleString("uk-UA");
const fmtSigned = (n) => (n > 0 ? "+" : n < 0 ? "−" : "") + Math.abs(n);
function dayPoints() {
  let p = D.today.points || 0;
  D.today.tasks.forEach((t) => { if (t.id in pending) p += pending[t.id] ? t.pts : -t.pts; });
  return p;
}
const rarName = (r) => RARITY_NAME[r][0].toUpperCase() + RARITY_NAME[r].slice(1);

function collTab() {
  const got = D.roster.filter((a) => a.unlocked).length;
  const count = (r) => D.roster.filter((a) => a.rarity === r && a.unlocked).length + "/" + D.roster.filter((a) => a.rarity === r).length;
  return `<div class="coll-head"><div><span class="num">${got}<span>/${D.roster.length}</span></span></div>
    <div class="rar">${["common", "rare", "epic", "legendary"].map((r) => `<span><i style="background:${RARITY_COLOR[r]}"></i>${count(r)}</span>`).join("")}</div></div>
  <div class="grid">${D.roster.map(cell).join("")}</div>`;
}

const creatureCache = {};
function creatureOf(a) { return (creatureCache[a.id] ||= makeCreature(a.seed, a.rarity)); }

function cell(a) {
  const rc = `--rc:${RARITY_COLOR[a.rarity]}`;
  if (!a.unlocked) return `<button class="cell locked" style="${rc}" data-lock="${a.id}"><div class="art egg">${eggSVG(a.rarity)}</div><div class="nm">${esc(a.hint)}</div><div class="pr"><i style="width:${a.progress * 100}%"></i></div></button>`;
  if (!seen.has(a.id)) return `<button class="cell new" style="${rc}" data-hatch="${a.id}"><div class="art egg">${eggSVG(a.rarity, 1)}</div><div class="nm">Тапни, щоб вилупити</div></button>`;
  const c = creatureOf(a);
  return `<button class="cell got ${a.rarity === "legendary" ? "leg" : ""}" style="${rc}" data-show="${a.id}"><span class="tag"></span><div class="art creature">${creatureSVG(c)}</div><div class="nm">${esc(c.name)}</div></button>`;
}

function histTab() {
  const p = D.player, heat = D.heat;
  const first = new Date(heat[0].d + "T12:00"), lead = (first.getDay() + 6) % 7;
  const cells = Array(lead).fill(`<span></span>`).concat(heat.map((h, i) => {
    const today = i === heat.length - 1;
    const bg = h.pct == null ? "" : `background:${heatColor(h.pct)}`;
    return `<button data-day="${i}" class="${today ? "today" : ""} ${h.pct === 100 ? "perfect" : ""}" style="${bg}"></button>`;
  }));
  const pts = heat.map((h, i) => [i, h.energy]).filter(([, e]) => e != null);
  const x = (i) => 6 + (i / (heat.length - 1)) * 288, y = (e) => 80 - ((e - 1) / 4) * 66;
  const line = pts.map(([i, e]) => `${x(i)},${y(e)}`).join(" ");
  return `<h3 style="margin-top:4px">6 тижнів</h3>
  <div class="heat-wrap"><div class="wd">${WD.map((d) => `<span>${d}</span>`).join("")}</div><div class="heat">${cells.join("")}</div>
  <div class="legend">менше ${[10, 40, 70, 100].map((v) => `<i style="background:${heatColor(v)}"></i>`).join("")} більше</div></div>
  <h3>Екранний час <span>14 днів</span></h3>
  <div class="energy">${(() => { const last = heat.slice(-14), max = Math.max(60, ...last.map((h) => h.screen || 0));
    return last.some((h) => h.screen != null) ? `<div class="bars">${last.map((h) => `<i class="${h.screen == null ? "empty" : ""}" style="height:${h.screen == null ? 3 : Math.max(4, (h.screen / max) * 100)}%"></i>`).join("")}</div><div class="legend" style="justify-content:space-between"><span>${hm(max)} макс</span><span>менше = краще</span></div>`
    : `<div style="padding:20px 0;text-align:center;color:var(--muted);font-weight:600">Надсилай скріни екранного часу в бот</div>`; })()}</div>
  <h3>Енергія <span>1–5</span></h3>
  <div class="energy">${pts.length > 1 ? `<svg viewBox="0 0 300 90" preserveAspectRatio="none">
    ${[1, 3, 5].map((e) => `<line x1="0" x2="300" y1="${y(e)}" y2="${y(e)}" stroke="var(--line)" stroke-dasharray="2 4"/>`).join("")}
    <polyline points="${line}" fill="none" stroke="var(--amber)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>` : `<div class="muted" style="padding:20px 0;text-align:center;color:var(--muted);font-weight:600">Згадуй у звітах, як почуваєшся — тут зʼявиться графік</div>`}</div>
  <h3>Усього</h3>
  <div class="stats">
    ${[[p.tasks, "справ виконано"], [p.reports, "звітів"], [p.voice, "голосових"], [p.perfect, "ідеальних днів"], [p.best, "рекорд серії"], [D.roster.filter((a) => a.unlocked).length, "істот"]].map(([n, l]) => `<div class="stat"><span class="num">${n}</span><small>${l}</small></div>`).join("")}
  </div>`;
}

function heatColor(p) {
  const a = css("--accent"), base = css("--heat0");
  const t = p <= 0 ? 0.12 : 0.25 + (p / 100) * 0.75;
  return `color-mix(in srgb, ${a} ${Math.round(t * 100)}%, ${base})`;
}

// ---------- взаємодія
function bind() {
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { haptic("s"); setTab(b.dataset.tab); });
  document.querySelectorAll("[data-go]").forEach((b) => b.onclick = () => { haptic("s"); setTab(b.dataset.go); });
  document.querySelectorAll("[data-task]").forEach((b) => b.onclick = (e) => toggleTask(b.dataset.task, b, e));
  document.querySelectorAll("[data-hatch]").forEach((b) => b.onclick = () => openHatch(D.roster.find((a) => a.id === b.dataset.hatch)));
  document.querySelectorAll("[data-show]").forEach((b) => b.onclick = () => showCreature(D.roster.find((a) => a.id === b.dataset.show)));
  document.querySelectorAll("[data-lock]").forEach((b) => b.onclick = () => { haptic("i", "light"); const a = D.roster.find((x) => x.id === b.dataset.lock); toast(`${a.hint} · ${Math.round(a.progress * 100)}%`); });
  document.querySelectorAll("[data-day]").forEach((b) => b.onclick = () => showDay(D.heat[+b.dataset.day]));
  $("#ptsChip").onclick = showLedger;
}

function setTab(id, instant) {
  tab = id;
  const i = TABS.findIndex(([t]) => t === id);
  const pill = $(".tabs .pill");
  if (instant) { pill.style.transition = "none"; requestAnimationFrame(() => pill.style.transition = ""); }
  pill.style.transform = `translateX(${i * 100}%)`;
  document.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === id));
  document.querySelectorAll("section.tab").forEach((s) => s.classList.toggle("on", s.id === "t-" + id));
  if (!instant) window.scrollTo({ top: Math.min(window.scrollY, $("nav").offsetTop), behavior: "smooth" });
}

function toggleTask(id, el, ev) {
  const t = D.today.tasks.find((x) => x.id === id);
  const before = todayStats().pct;
  const v = !taskDone(t);
  if (v === t.done) delete pending[id]; else pending[id] = v;
  el.classList.toggle("done", v);
  el.classList.toggle("pending", id in pending);
  haptic("i", v ? "medium" : "light");
  floatText((v ? "+" : "−") + t.pts, ev.clientX, ev.clientY);
  $("#ptsN").textContent = fmtSigned(dayPoints());
  const st = todayStats();
  $("#pctN").textContent = st.pct;
  $("#pctS").textContent = `${st.n} з ${st.all} ${plural(st.all, "справи", "справ", "справ")}`;
  $("#t-day h3 span").textContent = `${st.n}/${st.all}`;
  setRing(st.pct);
  if (st.pct === 100 && before < 100) { haptic("n", "success"); confetti(140); toast("Ідеальний день ★ +30 о 04:00"); }
  updateSave();
}

function floatText(t, x, y) { const f = document.createElement("div"); f.className = "float"; f.textContent = t; f.style.left = x - 14 + "px"; f.style.top = y - 30 + "px"; document.body.append(f); setTimeout(() => f.remove(), 1000); }

function updateSave() {
  const n = Object.keys(pending).length;
  const text = `Зберегти · ${n} ${plural(n, "зміна", "зміни", "змін")}`;
  if (inTG) {
    if (n) tg.MainButton.setParams({ text, color: css("--accent").startsWith("#") ? css("--accent") : "#C6F432", text_color: css("--accent-ink") || "#172000", is_visible: true });
    else tg.MainButton.hide();
  } else {
    $("#savebar").textContent = text;
    $("#savebar").classList.toggle("on", n > 0);
  }
}

function save() {
  const payload = JSON.stringify({ done: pending });
  if (inTG) {
    if (tg.initData) { toast("Відкрий через кнопку ◐ Прогрес у чаті, щоб зберігати"); return; }
    haptic("n", "success");
    tg.sendData(payload);
  } else {
    D.today.tasks.forEach((t) => { if (t.id in pending) t.done = pending[t.id]; });
    pending = {}; updateSave(); toast(demo ? "Демо: зміни збережено локально" : "Збережено"); render();
  }
}

// ---------- шторка
function openSheet(html, rc) {
  $("#sheetBody").innerHTML = html;
  $("#sheet").style.setProperty("--rc", rc || "var(--accent)");
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").onclick = closeSheet;
{ let y0 = null; const sh = $("#sheet");
  sh.addEventListener("touchstart", (e) => { if (sh.scrollTop <= 0) y0 = e.touches[0].clientY; }, { passive: true });
  sh.addEventListener("touchmove", (e) => { if (y0 != null && e.touches[0].clientY - y0 > 70) { closeSheet(); y0 = null; } }, { passive: true });
  sh.addEventListener("touchend", () => y0 = null); }

function showCreature(a) {
  haptic("i", "light");
  const c = creatureOf(a);
  openSheet(`<div class="creature big">${creatureSVG(c)}</div>
    <span class="rbadge">${RARITY_NAME[a.rarity]} істота</span><h2>${esc(c.name)}</h2>
    <div class="muted">Вилупилась ${new Date(a.unlocked + "T12:00").toLocaleDateString("uk-UA", { day: "numeric", month: "long" })} · ${esc(a.hint.toLowerCase())}</div>
    <div class="lore"><div><small>Суперсила</small>${esc(c.lore.power)}</div><div><small>Любить</small>${esc(c.lore.loves)}</div><div><small>Боїться</small>${esc(c.lore.fears)}</div></div>`, RARITY_COLOR[a.rarity]);
}

function showLedger() {
  haptic("s");
  const L = D.today.ledger || [];
  openSheet(`<h2>${fmtSigned(dayPoints())} сьогодні</h2><div class="muted">${fmtN(D.player.xp)} балів усього · рівень ${D.player.level}</div>
    <div class="ledger" style="margin-top:12px">${L.length ? L.slice().reverse().map((x) => `<div><span>${esc(x.w)}</span><b class="${x.p > 0 ? "plus" : "minus"}">${fmtSigned(x.p)}</b></div>`).join("") : `<div class="muted">Ще нічого. Відмічай пункти — бали зʼявляться тут.</div>`}</div>
    <div class="lore"><div><small>Як рахуються</small>звичка +10 · задача +15 · дедлайн +40 · пропуск звички −5 · перенесення −5×№ (дедлайн −10×№) · прострочення −5/−15 щодня · ідеальний день +30 · звіт +10</div></div>`);
}

function showDay(h) {
  haptic("s");
  const d = new Date(h.d + "T12:00");
  openSheet(`<h2>${d.toLocaleDateString("uk-UA", { weekday: "long", day: "numeric", month: "long" })}</h2>
    <div class="muted">${h.planned ? `${h.done} з ${h.planned} справ · ${h.pct}%` : "Справ не було"}${h.energy ? ` · енергія ${h.energy}/5` : ""}${h.report ? " · звіт ✓" : ""}${h.screen != null ? ` · 📱 ${hm(h.screen)}` : ""}${h.points ? ` · ${fmtSigned(h.points)} балів` : ""}</div>
    ${h.planned ? `<div class="bar" style="margin-top:14px"><i style="width:${h.pct}%;background:var(--accent)"></i></div>` : ""}
    ${(h.notes || []).map((n) => `<div class="note">${esc(n)}</div>`).join("") || `<div class="note" style="color:var(--muted)">Нотаток немає</div>`}`);
}

// ---------- вилуплення
let hatchA = null, taps = 0;
function openHatch(a) {
  hatchA = a; taps = 0;
  const h = $("#hatch"); h.className = "hatch on"; h.style.setProperty("--rc", RARITY_COLOR[a.rarity]);
  $("#hRar").textContent = { common: "звичайне", rare: "рідкісне", epic: "епічне", legendary: "легендарне" }[a.rarity] + " яйце";
  $("#hEgg").innerHTML = eggSVG(a.rarity, 0);
  $("#hTaps").innerHTML = "<i></i><i></i><i></i><i></i>";
  $("#hHint").textContent = "Тапай по яйцю";
  haptic("i", "medium");
}
$("#hEgg").onclick = () => {
  taps++;
  const egg = $("#hEgg");
  egg.classList.remove("hit"); void egg.offsetWidth; egg.classList.add("hit");
  document.querySelectorAll("#hTaps i").forEach((d, i) => d.classList.toggle("f", i < taps));
  if (taps < 4) {
    egg.innerHTML = eggSVG(hatchA.rarity, taps);
    $("#hHint").textContent = ["", "Щось ворушиться…", "Ще трохи!", "Майже!"][taps];
    haptic("i", ["", "light", "medium", "heavy"][taps]);
    return;
  }
  const c = creatureOf(hatchA);
  $("#hBorn").innerHTML = creatureSVG(c);
  $("#hName").textContent = c.name;
  $("#hLore").textContent = `Суперсила: ${c.lore.power}. Любить ${c.lore.loves}, боїться ${c.lore.fears}.`;
  $("#hRar").textContent = RARITY_NAME[hatchA.rarity] + " істота";
  $("#hatch").classList.add("out");
  haptic("n", "success");
  confetti(hatchA.rarity === "legendary" ? 260 : hatchA.rarity === "epic" ? 180 : 110, RARITY_COLOR[hatchA.rarity]);
  seen.add(hatchA.id);
  store.set("seen", JSON.stringify([...seen]));
};
$("#hTake").onclick = () => { $("#hatch").className = "hatch"; haptic("s"); const t = tab; render(); setTab(t, true); };

// ---------- конфеті (піксельне)
function confetti(n, color) {
  const cv = $("#confetti"), ctx = cv.getContext("2d"), dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ctx.scale(dpr, dpr);
  const cols = [color || css("--accent"), "#FFB23E", "#FF6B4A", "#6FB7FF", "#FFFFFF", "#B57BFF"];
  const ps = Array.from({ length: n }, () => ({ x: innerWidth / 2, y: innerHeight * 0.42, vx: (Math.random() - 0.5) * 14, vy: -Math.random() * 15 - 4, s: 4 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], r: Math.random() * 6, life: 0 }));
  let frame = 0;
  (function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    ps.forEach((p) => { p.vy += 0.42; p.vx *= 0.985; p.x += p.vx; p.y += p.vy; p.life++;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(Math.round(p.r + p.life * 0.1) * Math.PI / 4); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s); ctx.restore(); });
    if (++frame < 150) requestAnimationFrame(tick); else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

// ---------- старт
function applyTheme() {
  const dark = inTG ? tg.colorScheme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  if (inTG) { const bg = css("--bg"); try { tg.setHeaderColor(bg); tg.setBackgroundColor(bg); tg.setBottomBarColor?.(bg); } catch (e) {} }
}

(async function init() {
  $("#ldegg").innerHTML = eggSVG("rare", 1);
  if (inTG) { tg.ready(); tg.expand(); tg.onEvent("themeChanged", () => { applyTheme(); if (D) render(); }); tg.MainButton.onClick(save); }
  applyTheme();
  $("#savebar").onclick = save;
  try { seen = new Set(JSON.parse((await store.get("seen")) || "[]")); } catch (e) {}
  try {
    const cached = localStorage.getItem("snap");
    if (cached) { D = JSON.parse(cached); render(); }
  } catch (e) {}
  try {
    D = await load();
    if (!demo) try { localStorage.setItem("snap", JSON.stringify(D)); } catch (e) {}
    if (demo) seen = new Set(["a0", "a1", "a2", "a3", "a6", "a7"].filter((x) => !seen.size || seen.has(x)).concat([...seen]));
    render();
  } catch (e) {
    if (!D) $("#app").innerHTML = `<div class="loading"><div style="text-align:center">Не вдалося завантажити дані.<br><small style="color:var(--faint)">Перевір посилання або спробуй пізніше</small></div></div>`;
  }
})();
</script>
